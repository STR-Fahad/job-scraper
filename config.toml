database = "data/jobs.sqlite3"
timeout_seconds = 30
retries = 3
max_retry_delay = 120

[matching]
max_requests_per_run = 3
retries = 1
timeout_seconds = 120

[matching.weights]
required_skills = 40
experience = 25
role_alignment = 20
preferred_projects = 15

[[sources]]
source = "himalayas"
max_pages = 100
page_size = 20
interval_seconds = 2

[[sources]]
source = "remotive"

[[sources]]
source = "arbeitnow"
max_pages = 100
interval_seconds = 2

# Verified 2026-11-04 via `discover` (public Greenhouse board API, no authentication). Its jobs state
# the hiring region in the location field ("Home based - Worldwide", "Home Based - APAC"), which
# Module 2 reads. Collecting it fetches every posting, so a run takes about ten minutes.
[[sources]]
source = "greenhouse"
board = "canonical"
company = "Canonical"

# Verified 2026-11-04 via `discover` (public Ashby posting API, no authentication). 69 postings, many
# labelled "Remote, Global"; Module 2 reads those location labels.
[[sources]]
source = "ashby"
board = "supabase"
company = "Supabase"

# Verified public example boards (2026-10-25); enable only employers you want.
# Copy a block, use discovery, or enable via the sources command.
[[sources]]
source = "greenhouse"
enabled = false
board = "enveritas"
company = "Enveritas"

[[sources]]
source = "ashby"
enabled = false
board = "ashby"
company = "Ashby"

[[sources]]
source = "lever"
enabled = false
board = "spreetail"
company = "Spreetail"
region = "global"
page_size = 100
max_pages = 100

# Added 2026-11-18: public remote-job aggregators (JSON/RSS feeds; run at most once per 6 hours).
# Remote OK and Jobicy ask for a link back; the source name and link are stored on every job.
[[sources]]
source = "jobicy"

[[sources]]
source = "remoteok"
enabled = false  # stopped on the user's instruction 2026-11-24

[[sources]]
source = "workingnomads"

[[sources]]
source = "weworkremotely"
enabled = false  # stopped on the user's instruction 2026-11-24

